# Render Blueprint for the Express API.
# In Render: New + -> Blueprint -> pick this repo. Then set MONGODB_URI.
services:
  - type: web
    name: arena-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # Render generates a strong random secret automatically.
      - key: JWT_SECRET
        generateValue: true
      # Set this in the Render dashboard (MongoDB Atlas connection string).
      - key: MONGODB_URI
        sync: false
